name: Telegram Downloader

on:
  repository_dispatch:
    types: [download_request]

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install aria2
        run: sudo apt-get install -y aria2

      - name: Download file
        run: |
          mkdir -p downloads
          URL="${{ github.event.client_payload.url }}"
          FILE=$(basename "$URL")
          aria2c "$URL" -d downloads -o "$FILE"
          echo "FILE_NAME=$FILE" >> $GITHUB_ENV

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add downloads/
          git commit -m "Downloaded file ${{ env.FILE_NAME }}"
          git push

      - name: Send link back to Telegram
        run: |
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/main/downloads/${{ env.FILE_NAME }}"
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ Your file is ready:\n$RAW"
